[tox]
isolated_build = true
envlist = py314

[gh]
python =
    3.14 = py314,black,bandit,coverage

[testenv]
skip_install = true
setenv =
    DJANGO_SETTINGS_MODULE=tests.settings
    PYTHONPATH=$TOX_WORK_DIR/..
#PYTHONWARNINGS=always
allowlist_externals =
    poetry
commands_pre =
    poetry sync --only=main,test --all-extras
commands =
    django-admin check
    django-admin test --parallel 2 {posargs}

[testenv:coverage]
commands =
    coverage erase
    coverage run -m django test
    coverage report

[testenv:black]
commands_pre=
    poetry sync --only=dev --all-extras
commands = black --check --fast .

[testenv:bandit]
commands_pre=
    poetry sync --only=dev --all-extras
commands =
    bandit -c pyproject.toml -r --severity-level high jasmin_services
